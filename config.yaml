vault_path: "/home/seanleishman/Projects/Nordorn"

telegram:
  bot_token: "${TELEGRAM_BOT_TOKEN}"
  allowed_chat_ids:
    - 5000504204  # Sean Leishman
  send_notifications: true

ai:
  provider: "gemini"  # "groq", "gemini", or "anthropic"

  # Groq (free tier - recommended)
  groq_api_key: "${GROQ_API_KEY}"
  groq_model: "llama-3.3-70b-versatile"

  # Gemini (free tier)
  gemini_api_key: "${GEMINI_API_KEY}"
  gemini_model: "gemini-flash-latest"

  # Anthropic (paid)
  anthropic_api_key: "${ANTHROPIC_API_KEY}"
  anthropic_model: "claude-sonnet-5"

  max_tokens: 8192

output_folders:
  youtube: "02 Sources/Videos"
  article: "02 Sources/Articles"
  instagram: "02 Sources/Reels"
  books: "02 Sources/Books"
  default: "Clippings"

# AI chooses one of these categories to route notes
routing_categories:
  - name: "Programming"
    folder: "02 Sources/Articles/Programming"
  - name: "Machine Learning"
    folder: "02 Sources/Articles/ML"
  - name: "Finance"
    folder: "02 Sources/Articles/Finance"
  - name: "Productivity"
    folder: "02 Sources/Articles/Productivity"
  - name: "Science"
    folder: "02 Sources/Articles/Science"
  - name: "Other"
    folder: "02 Sources/Articles"

vault_writer:
  daily_notes_folder: "06 Daily Notes"
  ics_folder: ""  # Set to a path your calendar app watches for ICS files

youtube:
  fetch_transcript: true
  transcript_languages: ["en", "en-US", "en-GB"]
  # Use logged-in cookies from this browser to bypass "not a bot" rate-limiting
  # during channel crawls. Examples: "chrome", "firefox", "edge". Leave blank to skip.
  # Note: in WSL pointing at Windows Chrome WON'T decrypt cookies. Use cookies_file instead.
  cookies_from_browser: ""
  # Path to a Netscape-format cookies.txt (export via a "Get cookies.txt" extension
  # while logged into YouTube). Takes precedence over cookies_from_browser.
  cookies_file: "/home/seanleishman/.cache/obsidian_helper/youtube_cookies.txt"

instagram:
  # Path to a Netscape-format cookies.txt for reels that need a logged-in
  # session (private accounts, age-gated content). Same idiom as
  # youtube.cookies_file. Leave blank to skip.
  cookies_file: ""
  # Gemini model for the video-understanding call (speech transcript + visual
  # description). Must accept video input via the Files API. Video understanding
  # ALWAYS uses this Gemini key/model even if ai.provider is groq/anthropic —
  # Anthropic can't take raw video and Groq is audio-only.
  video_model: "gemini-flash-latest"
  # Video is ~300 tokens/second (a 60s reel is ~18k tokens). A reel longer than
  # this skips the Gemini call and produces a caption-only note instead.
  max_duration_seconds: 180
  # Folder holding Instagram's "Download your information" export, searched
  # recursively for saved_posts.json / liked_posts.json. Leave blank to skip
  # Instagram backfill. Re-export manually for each future backfill chunk.
  export_dir: ""

# What /backfill and unfiltered /crawl-without-topic runs should keep vs drop.
# Rendered to a free-text topic string and passed straight to the existing
# TopicFilterAgent — not a new agent.
interests:
  include: ["food & restaurants", "apartments & interiors", "life advice", "coding & software"]
  exclude: ["personal / friends", "comedy & memes", "random funny clips"]

backfill:
  max_items: 50   # cap on items processed per /backfill run — Instagram rate-limits hard; chunk across invocations

channel_crawl:
  max_videos: 25                  # cap on videos processed per /crawl
  title_filter_threshold: 25      # only run LLM title filter when more than this
  sleep_seconds: 2.0              # pause between videos
  transcript_filter_chars: 1500   # chars of desc+transcript used in stage-2 filter
  state_file: "data/crawl_state.json"
  manifest_timeout_seconds: 120   # how long the Telegram model-choice manifest waits for Start/Cancel

# Places map (python main.py --places): saved venues grouped and mapped.
places:
  home: null            # null = `origin` in ~/.config/personal/locations.toml (dotfiles);
                        # or a name from that file ("moorgate"), or [lon, lat] to override
  city: "London"
  country: "gb"
  region_km: 30         # a local venue geocoding further than this from home is treated as not found
  out_dir: "out"
  to_be_eaten: "08 Trackers/To Be Eaten.md"

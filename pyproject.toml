[project]
name = "obsidian-helper"
version = "0.1.0"
description = "Automated Obsidian bookmark processing with Telegram and AI summaries"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.79.0",
    "beautifulsoup4>=4.14.3",
    "google-genai>=1.62.0",
    "groq>=1.0.0",
    "python-dateutil>=2.9.0.post0",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "trafilatura>=2.0.0",
    "youtube-transcript-api>=1.2.4",
    "yt-dlp>=2026.2.4",
]

[project.scripts]
obsidian-helper = "main:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
